# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Democratizing German Energy Regulation
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: siddhi-s-kulkarni.github.io/Democratising-German-Energy-Regulation
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Fraunces
      body: Quicksand
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f6f8fa"
        lightgray: "#e3e8ee"
        gray: "#98a2b3"
        darkgray: "#3d4451"
        dark: "#181b21"
        secondary: "#0891b2"
        tertiary: "#6366f1"
        highlight: rgba(8, 145, 178, 0.1)
        textHighlight: "#ffd88a99"
      darkMode:
        light: "#12151b"
        lightgray: "#262b35"
        gray: "#6b7383"
        darkgray: "#ccd2dd"
        dark: "#f1f4f9"
        secondary: "#2dd4bf"
        tertiary: "#818cf8"
        highlight: rgba(45, 212, 191, 0.12)
        textHighlight: "#e0a94666"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: ./local-plugins/obsidian-flavored-markdown-custom
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: false
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: ./local-plugins/folder-page-custom
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: false
  - source: ./local-plugins/explorer-custom
    enabled: true
    options:
      folderDefaultState: collapsed
    layout:
      position: left
      priority: 50
  - source: ./local-plugins/graph-custom
    enabled: true
    options:
      globalGraph:
        depth: -1          # show everything, no cutoff
        scale: 1.2          # bigger, more immersive
        repelForce: 0.8     # spread nodes out more — more "web-like"
        enableRadial: true  # already default, keeps it circular/organic
        focusOnHover: true
        showTags: false     # hide tag nodes (e.g. inline #hashtags) — just the notes themselves
        opacityScale: 6      # labels readable without needing to hover/zoom first
    layout:
      position: right
      priority: 10
  - source: ./local-plugins/vault-page
    enabled: true
    order: 45
  - source: ./local-plugins/robots-txt
    enabled: true
    order: 900
  - source: ./local-plugins/nav-tabs
    enabled: true
    layout:
      position: afterBody
      priority: 1
  - source: ./local-plugins/search-custom
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        LinkedIn: https://www.linkedin.com/in/siddhikulkarni/
        GitHub: https://github.com/siddhi-s-kulkarni
        License: https://creativecommons.org/licenses/by-nc-nd/4.0/
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - nav-tabs
    folder:
      exclude:
        - reader-mode
        - nav-tabs
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - nav-tabs
      positions:
        right: []
    canvas: {}
    bases: {}
    vault:
      exclude:
        - article-title
        - content-meta
        - note-properties
        - breadcrumbs
        - table-of-contents
        - backlinks
        - reader-mode
        - page-title
        - spacer
      template: vault
